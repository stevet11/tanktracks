name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bin: build/tanktracks
          - os: windows-latest
            name: windows-x64
            bin: build/Release/tanktracks.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.bin }}" README.md LICENSE dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "tanktracks-${{ matrix.name }}.zip" ./dist/*
          else
            tar -czf "tanktracks-${{ matrix.name }}.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tanktracks-${{ matrix.name }}
          path: tanktracks-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
