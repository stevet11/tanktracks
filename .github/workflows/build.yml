name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          mkdir dist
          cp build/tanktracks README.md LICENSE dist/
          tar -czf tanktracks-linux-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: tanktracks-linux-x64
          path: tanktracks-linux-x64.tar.gz

  # The Windows .exe is cross-compiled with mingw-w64 (same as `make windows` locally); no Windows runner needed.
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Build
        run: make windows

      - name: Package
        run: |
          mkdir dist
          cp tanktracks.exe README.md LICENSE dist/
          (cd dist && zip -q ../tanktracks-windows-x64.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: tanktracks-windows-x64
          path: tanktracks-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
